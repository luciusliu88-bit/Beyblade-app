<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>戰鬥陀螺 X 數據庫瀏覽器</title>
  <style>
    :root {
      --bg-main: #0b1120;
      --bg-card: #162032;
      --bg-sidebar: #0f172a;
      --accent: #06b6d4;
      --accent-hover: #0891b2;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    /* 側邊欄 Sidebar */
    .sidebar { width: 260px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 10; }
    .logo { font-size: 1.2rem; font-weight: bold; color: var(--accent); margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
    .menu-title { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; }
    .menu-list { list-style: none; }
    .menu-item { display: flex; align-items: center; gap: 10px; padding: 12px 15px; border-radius: 8px; color: var(--text-main); text-decoration: none; margin-bottom: 5px; cursor: pointer; transition: 0.2s; }
    .menu-item:hover, .menu-item.active { background: #1e293b; color: var(--accent); }

    /* 主區域 Main Content */
    .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 25px; }
    
    /* 搜尋與篩選 Bar */
    .top-bar { display: flex; flex-wrap: wrap; gap: 15px; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .search-box { display: flex; align-items: center; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 15px; width: 300px; }
    .search-box input { background: transparent; border: none; color: white; outline: none; width: 100%; margin-left: 8px; }
    
    .filter-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 14px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .filter-btn.active, .filter-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }

    .btn-add { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-add:hover { background: var(--accent-hover); }

    /* 卡片網格 Card Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; text-align: center; position: relative; transition: transform 0.2s, box-shadow 0.2s; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
    .card img { width: 100%; height: 140px; object-fit: contain; margin-bottom: 10px; }
    .card-code { font-size: 0.8rem; color: var(--accent); font-weight: bold; }
    .card-title { font-size: 1rem; margin: 5px 0; font-weight: 600; }
    .card-type { font-size: 0.8rem; color: var(--text-muted); }
    .card-actions { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
    .btn-sm { padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; border: none; cursor: pointer; }
    .btn-edit { background: #3b82f6; color: white; }
    .btn-delete { background: #ef4444; color: white; }

    /* Modal 彈出視窗 */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 100; }
    .modal.active { display: flex; }
    .modal-content { background: var(--bg-card); border: 1px solid var(--border-color); width: 90%; max-width: 450px; border-radius: 12px; padding: 25px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; background: var(--bg-main); border: 1px solid var(--border-color); color: white; padding: 8px 12px; border-radius: 6px; outline: none; }
    .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  </style>
</head>
<body>

  <!-- 側邊欄（已移除紅筆標示之功能與社區 QR碼） -->
  <aside class="sidebar">
    <div>
      <div class="logo">
        ⚡ 戰鬥陀螺 X 瀏覽器
      </div>
      <div class="menu-title">功能選單</div>
      <ul class="menu-list">
        <li class="menu-item active">🏠 首頁</li>
      </ul>
    </div>
  </aside>

  <!-- 主內容區 -->
  <main class="main-content">
    <div class="top-bar">
      <div class="search-box">
        🔍 <input type="text" id="searchInput" placeholder="搜尋名稱或編號..." oninput="filterData()">
      </div>
      <div class="filter-group" id="seriesFilter">
        <button class="filter-btn active" onclick="setSeries('全部', this)">全部</button>
        <button class="filter-btn" onclick="setSeries('BX', this)">BX</button>
        <button class="filter-btn" onclick="setSeries('UX', this)">UX</button>
        <button class="filter-btn" onclick="setSeries('CX', this)">CX</button>
      </div>
      <button class="btn-add" onclick="openModal()">+ 新增陀螺零件</button>
    </div>

    <!-- 陀螺卡片列表 -->
    <div class="grid" id="beybladeGrid"></div>
  </main>

  <!-- 新增/編輯 Modal -->
  <div class="modal" id="itemModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">新增陀螺</h3>
        <button onclick="closeModal()" style="background:none;border:none;color:white;cursor:pointer;">✕</button>
      </div>
      <form id="itemForm" onsubmit="saveItem(event)">
        <input type="hidden" id="itemId">
        <div class="form-group">
          <label>產品編號</label>
          <input type="text" id="itemCode" placeholder="例如: BX-01" required>
        </div>
        <div class="form-group">
          <label>名稱</label>
          <input type="text" id="itemName" placeholder="例如: 蒼龍劍士" required>
        </div>
        <div class="form-group">
          <label>系列</label>
          <select id="itemSeries">
            <option value="BX">BX</option>
            <option value="UX">UX</option>
            <option value="CX">CX</option>
          </select>
        </div>
        <div class="form-group">
          <label>圖片網址</label>
          <input type="url" id="itemImg" placeholder="https://..." required>
        </div>
        <div class="form-actions">
          <button type="button" class="filter-btn" onclick="closeModal()">取消</button>
          <button type="submit" class="btn-add">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 預設資料
    const defaultData = [
      { id: '1', code: 'BX-01', name: '蒼龍劍士 3-60F', series: 'BX', img: 'https://images.unsplash.com/photo-1563089145-599997674d42?auto=format&fit=crop&w=300&q=80' },
      { id: '2', code: 'BX-02', name: '地獄鐮刀 4-60T', series: 'BX', img: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=300&q=80' },
      { id: '3', code: 'UX-01', name: '德魯伊騎士 1-60A', series: 'UX', img: 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=300&q=80' }
    ];

    let data = JSON.parse(localStorage.getItem('beyblade_data')) || defaultData;
    let currentSeries = '全部';

    function renderGrid() {
      const grid = document.getElementById('beybladeGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = data.filter(item => {
        const matchesSeries = currentSeries === '全部' || item.series === currentSeries;
        const matchesSearch = item.name.toLowerCase().includes(search) || item.code.toLowerCase().includes(search);
        return matchesSeries && matchesSearch;
      });

      grid.innerHTML = filtered.map(item => `
        <div class="card">
          <img src="${item.img}" alt="${item.name}">
          <div class="card-code">${item.code}</div>
          <div class="card-title">${item.name}</div>
          <div class="card-type">${item.series} 系列</div>
          <div class="card-actions">
            <button class="btn-sm btn-edit" onclick="editItem('${item.id}')">修改</button>
            <button class="btn-sm btn-delete" onclick="deleteItem('${item.id}')">刪除</button>
          </div>
        </div>
      `).join('');
    }

    function setSeries(series, btn) {
      currentSeries = series;
      document.querySelectorAll('#seriesFilter .filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.classList.add ? btn.classList.add('active') : btn.className += ' active';
      renderGrid();
    }

    function filterData() {
      renderGrid();
    }

    function openModal(item = null) {
      document.getElementById('itemModal').classList.add('active');
      if(item) {
        document.getElementById('modalTitle').innerText = '修改陀螺';
        document.getElementById('itemId').value = item.id;
        document.getElementById('itemCode').value = item.code;
        document.getElementById('itemName').value = item.name;
        document.getElementById('itemSeries').value = item.series;
        document.getElementById('itemImg').value = item.img;
      } else {
        document.getElementById('modalTitle').innerText = '新增陀螺零件';
        document.getElementById('itemForm').reset();
        document.getElementById('itemId').value = '';
      }
    }

    function closeModal() {
      document.getElementById('itemModal').classList.remove('active');
    }

    function saveItem(e) {
      e.preventDefault();
      const id = document.getElementById('itemId').value || Date.now().toString();
      const code = document.getElementById('itemCode').value;
      const name = document.getElementById('itemName').value;
      const series = document.getElementById('itemSeries').value;
      const img = document.getElementById('itemImg').value;

      const existingIndex = data.findIndex(item => item.id === id);
      if(existingIndex > -1) {
        data[existingIndex] = { id, code, name, series, img };
      } else {
        data.push({ id, code, name, series, img });
      }

      localStorage.setItem('beyblade_data', JSON.stringify(data));
      closeModal();
      renderGrid();
    }

    function editItem(id) {
      const item = data.find(i => i.id === id);
      if(item) openModal(item);
    }

    function deleteItem(id) {
      if(confirm('確定要刪除這筆資料嗎？')) {
        data = data.filter(i => i.id !== id);
        localStorage.setItem('beyblade_data', JSON.stringify(data));
        renderGrid();
      }
    }

    // 初始化渲染
    renderGrid();
  </script>
</body>
</html>
